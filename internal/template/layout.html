{{ define "layout" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .PostTitle }} | {{ .SiteTitle }}</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="content">
        {{ template "content" . }}
    </main>
    <footer class="footer">
        <p>{{ .Copyright }}</p>
        <a href="/rss.xml">RSS</a>
    </footer>
</body>
</html>
{{ end }}
